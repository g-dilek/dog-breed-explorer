<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dog Breed Explorer</title>

    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>

  <body>
    <header class="site-header">
      <div class="container">
        <h1>Dog Breed Explorer</h1>
        <p>Learn about dog breeds from around the world!</p>
      </div>
    </header>

    <main class="container">
      <section class="controls">
        <label for="search-input"> Search breeds </label>

        <input
          type="search"
          id="search-input"
          placeholder="Try collie, terrier, retriever..."
        />

        <div class="control-row">
          <label for="sort-select"> Sort: </label>

          <select id="sort-select">
            <option value="name-asc">Name A–Z</option>

            <option value="name-desc">Name Z–A</option>
          </select>
        </div>

        <p id="breed-count" aria-live="polite">Loading breeds...</p>
      </section>

      <section id="breed-grid" class="breed-grid" aria-live="polite">
        <!-- Breed cards inserted by JavaScript -->
      </section>

      <div class="load-more-container">
        <button id="load-more-button">Load more breeds</button>
      </div>

      <p id="status-message" class="status-message" aria-live="polite">
        Loading...
      </p>
    </main>

    <footer class="site-footer">
      <p>
        Data provided by
        <a href="https://thedogapi.com/" target="_blank" rel="noopener">
          TheDogAPI
        </a>
      </p>
      <p>Made with love by Grace ♥ for Claire</p>
    </footer>
  </body>
</html>
